<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
    <script type="module" src="src/components/checkbox/wc-checkbox.js"></script>
    <script type="module" src="src/components/checkbox/wc-checkbox-group.js"></script>
</head>

<body>
    <main>

        <article>
            <h1>Checkbox</h1>
            <form>
                <!-- <h3 id="id-group-label">Sandwich Condiments</h3> -->
                <wc-checkbox-group group-label="Sandwich Condiments">
                    <wc-checkbox>Lettuce</wc-checkbox>

                    <wc-checkbox>Mustard</wc-checkbox>
                    <wc-checkbox>Sprouts</wc-checkbox>
                </wc-checkbox-group>
                <button type="submit">Order</button>
            </form>
        </article>
    </main>
</body>

</html>
